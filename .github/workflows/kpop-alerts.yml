name: K-pop Telegram alerts

on:
  schedule:
    - cron: "0 1 * * 1"   # Mondays 09:00 Singapore time
  workflow_dispatch: {}   # "Run workflow" button for a test send

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARTISTS: ${{ vars.ARTISTS }}
          SG_ONLY: ${{ vars.SG_ONLY }}
        run: python kpop_bot.py
      - name: Remember which shows were sent
        run: |
          git config user.name "kpop-alerts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "Update sent shows"
          git push
