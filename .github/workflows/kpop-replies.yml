name: K-pop Telegram replies

on:
  schedule:
    - cron: "*/5 * * * *"   # check for new messages about every 5 minutes
  workflow_dispatch: {}

concurrency:
  group: telegram-updates   # never run two checks at once, so a message isn't answered twice
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Answer messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ARTISTS: ${{ vars.ARTISTS }}
          SG_ONLY: ${{ vars.SG_ONLY }}
        run: python3 kpop_bot.py --reply
